# Pre-commit hooks para GameLauncher
# Instalar: pre-commit install
# Correr manualmente: pre-commit run --all-files

repos:
  # ─── Ruff (linter + formatter) ──────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  # ─── Mypy (type checking) ───────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests>=2.31.0
          - types-psutil>=5.9.0
        stages: [pre-commit]

  # ─── Pytest (testes rápidos) ────────────────────────────
  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit tests)
        entry: pytest tests/unit -v --tb=short -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
        stages: [pre-push]

  # ─── Check de ficheiros ─────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict